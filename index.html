<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3301C"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png"><link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Cuaderno de Hanzi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Cuaderno de caligrafía: papel de arroz, tinta y un sello bermellón.
   Una columna para el móvil; la barra de pestañas va abajo. */
:root {
  --papel: #F3EFE5;
  --papel-2: #EAE4D6;
  --tinta: #17140F;
  --tinta-2: #5F574B;
  --linea: #D5CCBA;
  --bermellon: #B3301C;
  --bermellon-suave: #F1DDD5;
  --contorno: #DDD4C3;
  --cuadricula: #E2B8AC;
  --ok: #2F6B45;
  --mal: #B3301C;
  --display: "Playfair Display", "Times New Roman", serif;
  --hanzi: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --texto: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --papel: #15130F; --papel-2: #1F1C17; --tinta: #EEE8DA; --tinta-2: #A79E8E;
    --linea: #39342B; --bermellon: #E2593F; --bermellon-suave: #3A1F18; --contorno: #3A352C;
    --cuadricula: #5A3128; --ok: #6DB287; --mal: #E2593F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --papel: #15130F; --papel-2: #1F1C17; --tinta: #EEE8DA; --tinta-2: #A79E8E;
  --linea: #39342B; --bermellon: #E2593F; --bermellon-suave: #3A1F18; --contorno: #3A352C;
  --cuadricula: #5A3128; --ok: #6DB287; --mal: #E2593F; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--papel); color: var(--tinta); }
body {
  font: 400 16px/1.55 var(--texto);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent;
}
.col { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--bermellon); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; text-wrap: balance; margin: 0; }
.etq { font: 500 11px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--tinta-2); }
.hz { font-family: var(--hanzi); font-weight: 500; }
.num { font-variant-numeric: tabular-nums; }
hr { border: 0; border-top: 1px solid var(--linea); margin: 0; }

/* Cabecera */
.mast { display: flex; align-items: center; gap: 12px; padding: 18px 0 14px; border-bottom: 1px solid var(--tinta); }
.sello { width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: var(--bermellon); color: #FBF6EC; font: 700 24px/1 var(--hanzi); border-radius: 3px; }
.mast .t { display: grid; gap: 2px; min-width: 0; }
.mast h1 { font-size: 17px; letter-spacing: .08em; }
.sync { margin-left: auto; text-align: right; }

/* Pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--papel); border-top: 1px solid var(--tinta);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs .col { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 6px 0 4px; display: grid; justify-items: center; gap: 2px; color: var(--tinta-2); }
.tab .hz { font-size: 20px; line-height: 1.1; }
.tab .etq { font-size: 9.5px; letter-spacing: .1em; }
.tab[aria-current="page"] { color: var(--bermellon); }
.tab[aria-current="page"] .etq { color: var(--bermellon); }

.vista { padding-top: 22px; display: grid; gap: 22px; }
.vista[hidden] { display: none !important; }

/* Hoy */
.dia { display: grid; gap: 6px; }
.dia .grande { font: 500 52px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.dia .grande small { font-size: 20px; color: var(--tinta-2); letter-spacing: .06em; }
.bloques { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--tinta); }
.bloque { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--linea); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.bloque .n { font: 500 13px var(--mono); color: var(--tinta-2); align-self: start; padding-top: 3px; }
.bloque .q { display: grid; gap: 2px; min-width: 0; }
.bloque .q b { font: 600 17px/1.25 var(--texto); }
.bloque .q span { color: var(--tinta-2); font-size: 14px; }
.chip { font: 500 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; padding: 6px 8px; border: 1px solid var(--linea); border-radius: 2px; white-space: nowrap; color: var(--tinta-2); }
.chip.hecho { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.chip.ahora { border-color: var(--bermellon); color: var(--bermellon); }
.bloque.hecho .q b { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--tinta-2); }
.nota { border-left: 2px solid var(--bermellon); padding: 2px 0 2px 12px; color: var(--tinta-2); font-size: 14.5px; }
.nota b { color: var(--tinta); font-weight: 600; }

/* Botones */
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--tinta); background: none; padding: 11px 16px; border-radius: 2px; font: 500 13px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; min-height: 44px; }
.btn.pri { background: var(--tinta); color: var(--papel); }
.btn.rojo { background: var(--bermellon); border-color: var(--bermellon); color: #FBF6EC; }
.btn.sec { border-color: var(--linea); color: var(--tinta-2); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ancho { flex: 1 1 140px; }
.volver { background: none; border: 0; padding: 4px 0; font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-2); justify-self: start; }

/* Panel de un bloque */
.panel { display: grid; gap: 18px; }
.paso { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--tinta); padding-bottom: 8px; }
.paso h2 { font-size: 22px; }
.barra { height: 2px; background: var(--linea); }
.barra i { display: block; height: 100%; background: var(--bermellon); transition: width .3s; }

/* Ficha de carácter */
.ficha { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: center; }
.ficha .hz-g { font: 500 92px/1 var(--hanzi); grid-row: span 3; }
.ficha .py { font: 500 26px/1.1 var(--texto); }
.ficha .sig { font-size: 18px; }
.ficha .comp { font-family: var(--mono); font-size: 13px; color: var(--tinta-2); }
.mnemo { font: 400 17px/1.5 var(--texto); }
.ejemplos { display: grid; gap: 0; border-top: 1px solid var(--linea); }
.ej { display: grid; grid-template-columns: auto auto 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--linea); background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.ej .hz { font-size: 22px; }
.ej .p { font-weight: 600; }
.ej .s { color: var(--tinta-2); font-size: 14px; min-width: 0; }
.altavoz { width: 44px; height: 44px; border: 1px solid var(--linea); border-radius: 50%; background: none; display: inline-grid; place-items: center; flex: none; }
.altavoz svg { width: 18px; height: 18px; }
.mini-alt { font: 500 11px var(--mono); color: var(--bermellon); }

/* Lienzo 田字格 */
.lienzo { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 0 auto; border: 1.5px solid var(--bermellon); background: var(--papel); touch-action: none; }
.lienzo svg.grid { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.lienzo .hw { position: absolute; inset: 0; }
.lienzo .hw svg { display: block; }
.estado-quiz { text-align: center; min-height: 1.5em; font-size: 15px; color: var(--tinta-2); }
.estado-quiz.ok { color: var(--ok); }
.estado-quiz.mal { color: var(--mal); }
.pista { text-align: center; display: grid; gap: 4px; }
.pista .py { font: 600 26px/1.1 var(--texto); }
.pista .sig { font-size: 17px; color: var(--tinta-2); }

/* Tarjeta de reconocer */
.carta { border: 1px solid var(--linea); padding: 26px 16px; display: grid; justify-items: center; gap: 10px; text-align: center; }
.carta .hz-g { font: 500 112px/1 var(--hanzi); }
.carta .resp { display: grid; gap: 4px; justify-items: center; }

/* Tonos */
.tonos-op { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.op { border: 1px solid var(--tinta); background: none; padding: 14px 8px; border-radius: 2px; display: grid; justify-items: center; gap: 4px; min-height: 64px; }
.op .py { font: 600 21px/1.1 var(--texto); }
.op .etq { font-size: 10px; }
.op.ok { background: var(--ok); border-color: var(--ok); color: var(--papel); }
.op.ok .etq, .op.mal .etq { color: inherit; }
.op.mal { background: var(--bermellon-suave); border-color: var(--mal); }
.curva { width: 54px; height: 26px; }
.curva path { fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
.marcador { display: flex; justify-content: space-between; }

/* Lecturas */
.lista-lec { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--tinta); }
.lec-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 14px 0; border-bottom: 1px solid var(--linea); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.lec-item b { font: 600 17px var(--texto); }
.lec-item:disabled { cursor: default; }
.lec-item:disabled b { color: var(--tinta-2); }
.linea { display: grid; gap: 3px; padding: 12px 0; border-bottom: 1px solid var(--linea); width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; }
.linea .hz { font-size: 26px; line-height: 1.45; letter-spacing: .02em; }
.linea .hz u { text-decoration: none; border-bottom: 1.5px dotted var(--bermellon); }
.linea .py { color: var(--tinta); font-size: 15px; }
.linea .es { color: var(--tinta-2); font-size: 14.5px; }
.linea.sonando { background: var(--papel-2); }
.glosas { display: grid; gap: 4px; font-size: 14.5px; color: var(--tinta-2); }
.glosas .hz { color: var(--tinta); }
.interruptores { display: flex; gap: 8px; flex-wrap: wrap; }
.interruptor { border: 1px solid var(--linea); background: none; padding: 8px 12px; border-radius: 2px; font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-2); min-height: 40px; }
.interruptor[aria-pressed="true"] { border-color: var(--tinta); color: var(--tinta); background: var(--papel-2); }

/* Frases */
textarea { width: 100%; min-height: 120px; resize: vertical; font: 400 22px/1.5 var(--hanzi); background: var(--papel-2); color: var(--tinta); border: 1px solid var(--linea); border-radius: 2px; padding: 12px; }
.corr { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.corr .hz { font-size: 22px; }
.corr .mal-txt { text-decoration: line-through; color: var(--tinta-2); font-size: 18px; }
.corr .es { color: var(--tinta-2); font-size: 14.5px; }

/* Avance */
.cifras { display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--tinta); }
.cifra { padding: 14px 0; border-bottom: 1px solid var(--linea); display: grid; gap: 2px; }
.cifra:nth-child(odd) { padding-right: 12px; border-right: 1px solid var(--linea); }
.cifra:nth-child(even) { padding-left: 14px; }
.cifra .v { font: 500 38px/1 var(--display); }
.cifra .v small { font-size: 16px; color: var(--tinta-2); }
.ritmo { font-size: 15px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 340px; }
.cal .d { aspect-ratio: 1; border: 1px solid var(--linea); display: grid; place-items: center; font: 400 10px var(--mono); color: var(--tinta-2); border-radius: 2px; }
.cal .d.l1 { background: var(--bermellon-suave); }
.cal .d.l2 { background: color-mix(in srgb, var(--bermellon) 45%, var(--papel)); color: var(--tinta); }
.cal .d.l3 { background: var(--bermellon); color: #FBF6EC; border-color: var(--bermellon); }
.cal .d.hoy { outline: 2px solid var(--tinta); outline-offset: 1px; }
.cal .d.fuera { visibility: hidden; }
.cal .cab { font: 500 10px var(--mono); text-align: center; color: var(--tinta-2); }
.leyenda { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.leyenda span { display: inline-flex; gap: 6px; align-items: center; }
.leyenda i { width: 12px; height: 12px; display: inline-block; border: 1px solid var(--linea); }
.mapa { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 3px; }
.mapa button { aspect-ratio: 1; border: 1px solid var(--linea); background: none; font: 500 20px/1 var(--hanzi); color: color-mix(in srgb, var(--tinta-2) 55%, var(--papel)); padding: 0; border-radius: 2px; }
.mapa button.f1 { color: var(--tinta); background: var(--papel-2); }
.mapa button.f2 { color: var(--tinta); border-color: var(--tinta-2); }
.mapa button.f3 { color: var(--papel); background: var(--tinta); border-color: var(--tinta); }
.mapa button.sig { border-color: var(--bermellon); color: var(--bermellon); }
.ajuste { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Escribir */
.selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 3px; max-height: 200px; overflow-y: auto; border-top: 1px solid var(--linea); border-bottom: 1px solid var(--linea); padding: 6px 0; }
.selector button { aspect-ratio: 1; border: 1px solid transparent; background: none; font: 500 22px/1 var(--hanzi); padding: 0; border-radius: 2px; }
.selector button[aria-pressed="true"] { border-color: var(--bermellon); color: var(--bermellon); }
.selector button.nuevo { color: var(--tinta-2); }

/* Guía */
.guia { display: grid; gap: 26px; }
.guia section { display: grid; gap: 10px; }
.guia h2 { font-size: 21px; border-bottom: 1px solid var(--tinta); padding-bottom: 6px; }
.guia p { margin: 0; max-width: 65ch; }
.tabla { overflow-x: auto; }
.tabla table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
.tabla th, .tabla td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--linea); vertical-align: top; }
.tabla th { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta-2); }
.tabla td b { font-weight: 600; }
.cuarteto { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.cuarteto button { border: 1px solid var(--linea); background: none; padding: 10px 4px; display: grid; justify-items: center; gap: 2px; border-radius: 2px; }
.cuarteto .hz { font-size: 26px; }
.trazos { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.trazo { border: 1px solid var(--linea); padding: 10px; display: grid; gap: 4px; }
.trazo svg { width: 40px; height: 40px; }
.trazo svg path { fill: none; stroke: var(--tinta); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.reglas { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Entrar */
.entrar { display: grid; gap: 8px; max-width: 360px; }
.entrar input { font: 500 20px/1.2 var(--texto); color: var(--tinta); background: var(--papel-2); border: 1px solid var(--linea); border-bottom: 1.5px solid var(--tinta); border-radius: 2px; padding: 12px; width: 100%; }
.entrar #i-pin { font-family: var(--mono); letter-spacing: .5em; }
.entrar label { margin-top: 8px; }
.entrar .estado-quiz { text-align: left; }

.vacio { color: var(--tinta-2); font-size: 15px; }
.aviso { font-size: 14px; color: var(--tinta-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) {
  .tonos-op { grid-template-columns: repeat(4, 1fr); }
  .dia .grande { font-size: 64px; }
}
</style>

<div class="col">
  <header class="mast">
    <div class="sello" aria-hidden="true">汉</div>
    <div class="t">
      <h1>Cuaderno de Hanzi</h1>
      <span class="etq" id="m-fecha"></span>
    </div>
    <span class="etq sync" id="m-sync">Sin conexión</span>
  </header>

  <main>
    <section class="vista" id="v-entrar" hidden></section>
    <section class="vista" id="v-hoy" hidden></section>
    <section class="vista" id="v-escribir" hidden></section>
    <section class="vista" id="v-tonos" hidden></section>
    <section class="vista" id="v-leer" hidden></section>
    <section class="vista" id="v-avance" hidden></section>
    <section class="vista" id="v-guia" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="col">
    <button class="tab" data-v="hoy" aria-current="page"><span class="hz">今</span><span class="etq">Hoy</span></button>
    <button class="tab" data-v="escribir"><span class="hz">写</span><span class="etq">Escribir</span></button>
    <button class="tab" data-v="tonos"><span class="hz">声</span><span class="etq">Tonos</span></button>
    <button class="tab" data-v="leer"><span class="hz">读</span><span class="etq">Leer</span></button>
    <button class="tab" data-v="avance"><span class="hz">进</span><span class="etq">Avance</span></button>
  </div>
</nav>

const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const GRID = '<svg class="grid" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><g stroke="var(--cuadricula)" stroke-width=".5" stroke-dasharray="2 2" fill="none"><path d="M50 0V100M0 50H100M0 0L100 100M100 0L0 100"/></g></svg>';

/* Lanza el ejercicio de trazar. modo: "calca" (con contorno) o "memoria" (sin nada). */
function ejercicio(el, h, modo, alTerminar) {
  const caja = document.createElement("div");
  const estado = document.createElement("p");
  estado.className = "estado-quiz";
  estado.textContent = modo === "calca" ? "Traza encima del contorno, en orden." : "Escríbelo de memoria. Tras 3 fallos en un trazo te doy una pista.";
  el.replaceChildren(caja, estado);
  const w = lienzo(caja, h, { showOutline: modo === "calca" });
  let ayuda = false;
  w.quiz({
    showHintAfterMisses: modo === "calca" ? 1 : 3,
    leniency: 1.15,
    onMistake: d => {
      estado.className = "estado-quiz mal";
      estado.textContent = d.mistakesOnStroke >= 3 ? "Mira la pista que parpadea." : "Ese trazo no va así. Prueba otra vez.";
      if (d.mistakesOnStroke >= 3) ayuda = true;
    },
    onCorrectStroke: d => { estado.className = "estado-quiz"; estado.textContent = `Trazo ${d.strokeNum + 1} de ${d.strokeNum + 1 + d.strokesRemaining}`; },
    onComplete: r => {
      const ok = r.totalMistakes <= 2 && !ayuda;
      estado.className = "estado-quiz " + (ok ? "ok" : "mal");
      estado.textContent = ok ? (r.totalMistakes ? `Bien, con ${r.totalMistakes} error${r.totalMistakes > 1 ? "es" : ""}.` : "Perfecto.") : `Terminado con ${r.totalMistakes} errores. Vuelve a salir pronto.`;

    },

}

      }
    };

    const relampago = () => {

        escritorActual = ejercicio($("#zona"), c.h, "memoria", r => {

          $("#b-s").addEventListener("click", sig);

    uno();
  }
}

/* Bloque 3: tonos */
const CURVAS = { 1: "M6 6H48", 2: "M6 21L48 5", 3: "M6 11Q20 26 30 21T48 6", 4: "M6 5L48 22", 0: "M24 14h4" };
const NOMBRES = { 1: "1.º alto", 2: "2.º sube", 3: "3.º baja y sube", 4: "4.º cae", 0: "neutro" };
const curva = t => `<svg class="curva" viewBox="0 0 54 26" aria-hidden="true"><path d="${CURVAS[t]}"/></svg>`;
function conTono(base, t) {
  if (!t) return base;
  const M = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ" };
  let pos = base.search(/[ae]/);
  if (pos < 0) pos = base.indexOf("ou");
  if (pos < 0) { for (let i = base.length - 1; i >= 0; i--) if ("iouü".includes(base[i])) { pos = i; break; } }
  if (pos < 0) return base;
  return base.slice(0, pos) + M[base[pos]][t - 1] + base.slice(pos + 1);
}
const quitarTonos = s => s.normalize("NFD").replace(/[̀-̄̌]/g, "").normalize("NFC");
function preguntasTonos(n = 10) {
  const palabras = palabrasConocidas().filter(p => p.t && p.t !== "0"); // 的, 了… solo suenan bien dentro de una frase
  const qs = [];
  for (let i = 0; i < n; i++) {
    if (palabras.length >= 6 && i % 2 === 1) {
      const p = palabras[Math.floor(Math.random() * palabras.length)];
      const correcta = p.t;
      const ops = new Set([correcta]);
      const partes = correcta.split("-");
      let intentos = 0;
      while (ops.size < 4 && intentos++ < 50) {
        const v = partes.map(x => (Math.random() < .5 ? x : String(1 + Math.floor(Math.random() * 4))));
        ops.add(v.join("-"));
      }
      qs.push({ tipo: "palabra", p, correcta, ops: [...ops].sort(() => Math.random() - .5) });
    } else {
      const q = D.cuartetos[Math.floor(Math.random() * D.cuartetos.length)];
      const t = 1 + Math.floor(Math.random() * 4);
      qs.push({ tipo: "silaba", base: q.b, h: q.h[t - 1], correcta: String(t), ops: ["1", "2", "3", "4"] });
    }
  }
  return qs;
}
function sesionTonos(panel, alTerminar, contar = true) {
  const qs = preguntasTonos();
  let i = 0, aciertos = 0;
  const sig = () => {
    if (i >= qs.length) {
      if (contar) { const r = registroDia(); r.ton += qs.length; r.tonOk += aciertos; guardar(); }
      panel.innerHTML = `${cabecera("Tonos", `${aciertos} de ${qs.length}`, 1)}<p class="nota"><b>${aciertos} de ${qs.length} aciertos.</b> ${aciertos >= 8 ? "Muy buen oído." : "Normal al principio: el 1.º y el 4.º se confunden mucho. Repite en voz alta exagerando la curva."}</p><div class="btns" id="acc"></div>`;
      alTerminar(panel.querySelector("#acc"));
      return;
    }
    const q = qs[i++];
    const opHTML = q.ops.map(o => {
      const ts = o.split("-");
      const etiqueta = q.tipo === "silaba" ? conTono(q.base, +o) : ts.map(t => t === "0" ? "·" : t).join(" · ");
      return `<button class="op" data-o="${o}">${ts.length === 1 ? curva(+o) : ""}<span class="py">${esc(etiqueta)}</span><span class="etq">${ts.length === 1 ? NOMBRES[o] : ts.map(t => NOMBRES[t].split(" ")[0]).join(" ")}</span></button>`;
    }).join("");
    const enunciado = q.tipo === "silaba" ? `<span class="py">${esc(q.base)}</span><span class="sig">¿Qué tono oyes?</span>` : `<span class="hz" style="font-size:40px">${esc(q.p.h)}</span><span class="py">${esc(quitarTonos(q.p.p))}</span><span class="sig">¿Qué tonos tiene? (· es neutro)</span>`;
    const audio = q.tipo === "silaba" ? q.h : q.p.a;
    panel.innerHTML = `${cabecera("Tonos", `${i} de ${qs.length}`, i / qs.length)}
      <div class="pista">${enunciado}<div>${botonAudio(audio, "Escuchar otra vez")}</div></div>
      <div class="tonos-op">${opHTML}</div><p class="aviso" id="expl"></p><div class="btns" id="acc"></div>`;
    setTimeout(() => sonar(audio), 200);
    panel.querySelectorAll(".op").forEach(b => b.addEventListener("click", () => {
      if (panel.querySelector(".op.ok")) return;
      const bien = b.dataset.o === q.correcta;
      if (bien) aciertos++;
      panel.querySelectorAll(".op").forEach(x => { if (x.dataset.o === q.correcta) x.classList.add("ok"); else if (x === b) x.classList.add("mal"); x.disabled = true; });
      let expl = q.tipo === "silaba" ? `${q.h} = ${conTono(q.base, +q.correcta)}` : `${q.p.h} = ${q.p.p}: ${q.p.s}`;
      if (q.tipo === "palabra" && /3-3/.test(q.correcta)) expl += ". Ojo: dos 3.º tonos seguidos se pronuncian 2.º + 3.º.";
      if (q.tipo === "palabra" && q.p.h.startsWith("不") && q.correcta.startsWith("2")) expl += ". 不 pasa a 2.º tono antes de un 4.º.";
      $("#expl").textContent = expl;
      sonar(audio);
      $("#acc").innerHTML = `<button class="btn pri ancho" id="b-s">Siguiente</button>`;
      $("#b-s").addEventListener("click", sig);
    }));
  };
  sig();
}
function blqTonos(panel, fin) {
  sesionTonos(panel, acc => { acc.innerHTML = `<button class="btn pri" id="b-fin">Siguiente bloque</button>`; $("#b-fin").addEventListener("click", fin); });
}

/* Bloque 4: lectura */
let LECTURAS = [...D.lecturas];
function estadoLectura(l) {
  const glos = new Set(l.glosas.map(g => g.h).join(""));
  const hs = new Set(l.lineas.map(x => x.h).join("").replace(/[^一-鿿]/g, ""));
  const necesarios = [...hs].filter(h => !glos.has(h));
  const sabe = necesarios.filter(h => S.cartas[h]).length;
  return { sabe, total: necesarios.length, abierta: necesarios.length === 0 || sabe / necesarios.length >= .8 };
}
function lecturaDeHoy() {
  const abiertas = LECTURAS.filter(l => estadoLectura(l).abierta).sort((a, b) => a.orden - b.orden);
  return abiertas.find(l => !S.lecturas[l.id]) || abiertas[abiertas.length - 1] || null;
}
function blqLeer(panel, fin) {
  const l = lecturaDeHoy();
  if (!l) {
    const pal = palabrasConocidas();
    panel.innerHTML = `${cabecera("Escucha", "Antes de leer", 1)}
      <p class="vacio">La primera lectura se abre cuando sepas casi todos sus caracteres. Mientras tanto: escucha cada palabra que ya sabes y repítela en voz alta 3 veces, imitando la melodía.</p>
      ${pal.length ? `<div class="ejemplos">${pal.map(p => `<button class="ej" data-audio="${esc(p.a)}"><span class="hz">${esc(p.h)}</span><span class="p">${esc(p.p)}</span><span class="s">${esc(p.s)}</span><span class="mini-alt">▶</span></button>`).join("")}</div>` : `<p class="aviso">Aún no hay palabras completas. Vuelve después de los caracteres nuevos o escucha los tonos de la guía.</p>`}
      <div class="btns"><button class="btn pri" id="b-fin">Hecho</button></div>`;
    $("#b-fin").addEventListener("click", fin);
    return;
  }
  lector(panel, l, () => { S.lecturas[l.id] = Date.now(); registroDia().lec++; guardar(); fin(); });
}
function lector(panel, l, alTerminar) {
  const glosas = new Map(l.glosas.map(g => [g.h, g]));
  const marcar = txt => {
    // subraya lo que aún no sabes; las glosas aparecen debajo
    return [...txt].map(ch => /[一-鿿]/.test(ch) && !S.cartas[ch] ? `<u>${esc(ch)}</u>` : esc(ch)).join("");
  };
  let verPy = false, verEs = false;
  panel.innerHTML = `${cabecera(esc(l.titulo), esc(l.nivel), 1)}
    <p class="aviso">1. Escucha todo. 2. Toca cada línea, escúchala y repítela a la vez que el audio (shadowing), 3 veces. 3. Léela sola en voz alta. Lo subrayado aún no lo has estudiado.</p>
    <div class="interruptores"><button class="interruptor" id="t-todo">▶ Escuchar todo</button><button class="interruptor" id="t-py" aria-pressed="false">Pinyin</button><button class="interruptor" id="t-es" aria-pressed="false">Traducción</button></div>
    <div id="lineas">${l.lineas.map((x, i) => `<button class="linea" data-i="${i}"><span class="hz">${marcar(x.h)}</span><span class="py" hidden>${esc(x.p)}</span><span class="es" hidden>${esc(x.s)}</span></button>`).join("")}</div>
    ${l.glosas.length ? `<div class="glosas"><span class="etq">Palabras nuevas</span>${l.glosas.map(g => `<span><span class="hz">${esc(g.h)}</span> ${esc(g.p)}: ${esc(g.s)}</span>`).join("")}</div>` : ""}
    <div class="btns" id="acc"><button class="btn pri ancho" id="b-leida">La leí en voz alta</button></div>`;
  const lineas = [...panel.querySelectorAll(".linea")];
  const resaltar = i => lineas.forEach((b, j) => b.classList.toggle("sonando", j === i));
  lineas.forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i; resaltar(i); sonar(l.lineas[i].h, () => resaltar(-1)); }));
  $("#t-todo").addEventListener("click", () => {
    let i = 0;
    const paso = () => { if (i >= l.lineas.length) return resaltar(-1); resaltar(i); sonar(l.lineas[i].h, () => setTimeout(paso, 500)); i++; };
    paso();
  });
  $("#t-py").addEventListener("click", e => { verPy = !verPy; e.currentTarget.setAttribute("aria-pressed", verPy); panel.querySelectorAll(".linea .py").forEach(x => (x.hidden = !verPy)); });
  $("#t-es").addEventListener("click", e => { verEs = !verEs; e.currentTarget.setAttribute("aria-pressed", verEs); panel.querySelectorAll(".linea .es").forEach(x => (x.hidden = !verEs)); });
  $("#b-leida").addEventListener("click", alTerminar);
}

    </div>
    <p class="ritmo">${ap.length ? (dif >= 0 ? `Vas <b>al día</b>${dif > 0 ? `, con ${dif} de ventaja` : ""}.` : `Vas <b>${-dif} por detrás</b> del plan. No intentes recuperarlo de golpe: el repaso va primero.`) : "Aún no empiezas. El plan: 5 caracteres al día, 6 días a la semana."} Meta del ${esc(fechaLarga(FIN()).replace(/^\S+ /, ""))}: el HSK 1 completo y unos 100 caracteres del HSK 2.</p>
    <section style="display:grid;gap:10px"><span class="etq">Calendario · ${corta(INICIO())} → ${corta(FIN())}</span>
      <div class="cal">${["L", "M", "X", "J", "V", "S", "D"].map(x => `<span class="cab">${x}</span>`).join("")}${'<span class="d fuera"></span>'.repeat(primerDow)}${celdas.join("")}</div>
      <div class="leyenda etq"><span><i></i>0</span><span><i style="background:var(--bermellon-suave)"></i>1–2 bloques</span><span><i style="background:color-mix(in srgb, var(--bermellon) 45%, var(--papel))"></i>3–4</span><span><i style="background:var(--bermellon)"></i>sesión completa</span></div>
    </section>
    <section style="display:grid;gap:10px"><span class="etq">Los ${CH.length} caracteres · toca uno para practicarlo</span>
      <div class="mapa">${CH.map((c, i) => { const fz = fuerza(c.h); const sig = !S.cartas[c.h] && porAprender().indexOf(c) < S.porDia; return `<button data-h="${esc(c.h)}" class="${fz < 0 ? (sig ? "sig" : "") : fz >= 4 ? "f3" : fz >= 2 ? "f2" : "f1"}" title="${esc(c.p + " · " + c.s)}">${esc(c.h)}</button>`; }).join("")}</div>
      <div class="leyenda etq"><span><i style="border-color:var(--bermellon)"></i>siguientes</span><span><i style="background:var(--papel-2)"></i>recién aprendido</span><span><i style="border-color:var(--tinta-2)"></i>afianzándose</span><span><i style="background:var(--tinta)"></i>sólido</span></div>
    </section>
    <section style="display:grid;gap:10px"><span class="etq">Caracteres nuevos por día</span>
      <div class="ajuste">${[3, 5, 8].map(k => `<button class="interruptor" data-pd="${k}" aria-pressed="${S.porDia === k}">${k}</button>`).join("")}<span class="aviso">5 es el ritmo del plan. Baja a 3 si los repasos pasan de 15 minutos.</span></div>
    </section>
    <section style="display:grid;gap:10px"><span class="etq">Tus frases</span><div id="frases"><p class="vacio">Cargando…</p></div></section>
    <section style="display:grid;gap:10px"><span class="etq">Tu cuenta</span>
      <p class="aviso">Entraste como <b>${esc(SESION ? SESION.usuario : "")}</b>. Tu avance se guarda en tu cuenta: entra con el mismo usuario y PIN en el celular y en el PC.</p>
      <div class="btns"><button class="btn sec" id="b-guia2">Abrir la guía</button><button class="btn sec" id="b-compartir">Invitar a alguien</button><button class="btn sec" id="b-salir">Salir</button></div>
      <p class="aviso" id="m-compartir" hidden></p>
    </section>`;
  $("#b-salir").addEventListener("click", () => { api("/salir", { method: "POST" }).catch(() => {}); cerrarSesion(); });
  $("#b-compartir").addEventListener("click", async () => {
    const enlace = location.origin + location.pathname;
    const m = $("#m-compartir"); m.hidden = false;
    try { await navigator.clipboard.writeText(enlace); m.textContent = `Enlace copiado: ${enlace}. Quien lo abra se crea su propio usuario y PIN; su avance es solo suyo.`; }
    catch (e) { m.textContent = `Comparte este enlace: ${enlace}. Quien lo abra se crea su propio usuario y PIN.`; }
  });
  el.querySelectorAll(".mapa button").forEach(b => b.addEventListener("click", () => { elegido = b.dataset.h; ir("escribir"); }));
  el.querySelectorAll("[data-pd]").forEach(b => b.addEventListener("click", () => { S.porDia = +b.dataset.pd; guardar(); pintarAvance(); }));
  $("#b-guia2").addEventListener("click", () => ir("guia"));
  try {
    const lista = await api("/frases");
    const caja = $("#frases"); if (!caja) return;
    caja.innerHTML = !lista.length ? `<p class="vacio">Aún no has escrito frases.</p>` : lista.map(x => `<div class="corr"><span class="etq">${esc(fechaLarga(x.fecha))}</span><span class="hz">${esc(x.texto)}</span>${x.resultado && x.resultado.frases ? x.resultado.frases.filter(f => !f.ok).map(f => `<span class="es">→ <span class="hz">${esc(f.correcta)}</span> ${esc(f.nota)}</span>`).join("") : ""}</div>`).join("");
  } catch (e) { const caja = $("#frases"); if (caja) caja.innerHTML = `<p class="vacio">No pude cargar tus frases ahora.</p>`; }
}

/* ---------- GUÍA ---------- */
const TRAZOS_BASICOS = [
  ["héng 横", "Horizontal", "De izquierda a derecha.", "M10 50H90"],
  ["shù 竖", "Vertical", "De arriba abajo.", "M50 10V90"],
  ["piě 撇", "Barrido izquierda", "Baja curvándose hacia la izquierda.", "M70 12Q60 60 15 88"],
  ["nà 捺", "Barrido derecha", "Baja hacia la derecha y se ensancha.", "M20 15Q45 60 88 82"],
  ["diǎn 点", "Punto", "Un toque corto hacia abajo a la derecha.", "M42 35L58 58"],
  ["tí 提", "Subida", "Sube en diagonal hacia la derecha.", "M18 75L82 35"],
  ["zhé 折", "Quiebre", "Horizontal que gira y baja.", "M15 25H80V85"],
  ["gōu 钩", "Gancho", "Termina con un golpe pequeño hacia arriba.", "M50 10V82L32 70"],
];
function pintarGuia() {
  const el = $("#v-guia");
  el.innerHTML = `<button class="volver" id="b-v">← Volver</button>
  <div class="guia">
    <div class="dia"><span class="etq">Semana 1</span><h2 style="border:0;font-size:30px">Guía para empezar</h2><p class="aviso">Léela una vez el primer día y vuelve cuando dudes. Toca cualquier carácter con ▶ para oírlo.</p></div>

    <section><h2>1 · Los cuatro tonos</h2>
      <p>Cada sílaba tiene una melodía, y esa melodía cambia el significado. Exagera las curvas al principio: es mejor pasarse que quedarse corto.</p>
      <div class="cuarteto">${[1, 2, 3, 4].map(t => `<button data-audio="${"妈麻马骂"[t - 1]}">${curva(t)}<span class="hz">${"妈麻马骂"[t - 1]}</span><span class="py">${conTono("ma", t)}</span><span class="etq">${["mamá", "cáñamo", "caballo", "regañar"][t - 1]}</span></button>`).join("")}</div>
      <div class="tabla"><table><tr><th>Tono</th><th>Cómo suena</th></tr>
        <tr><td><b>1.º ā</b></td><td>Alto y plano, como cantar una nota sostenida.</td></tr>
        <tr><td><b>2.º á</b></td><td>Sube, como cuando preguntas «¿Qué?» sorprendido.</td></tr>
        <tr><td><b>3.º ǎ</b></td><td>Baja hasta abajo del todo. Dentro de una frase casi nunca vuelve a subir: piensa en él como «tono bajo».</td></tr>
        <tr><td><b>4.º à</b></td><td>Cae fuerte y rápido, como una orden: «¡Ya!».</td></tr>
        <tr><td><b>Neutro</b></td><td>Corto y suave, sin marca: 吗 ma, 的 de.</td></tr></table></div>
      <p><b>Dos reglas de cambio</b> que oirás todo el tiempo: dos 3.º seguidos → el primero se dice en 2.º (你好 se escribe nǐ hǎo y suena ní hǎo). Y 不 bù pasa a bú antes de un 4.º tono (不是 bú shì).</p>
    </section>

    <section><h2>2 · El pinyin para hispanohablantes</h2>
      <p>El pinyin usa letras latinas, pero varias no suenan como en español. Estas son las trampas:</p>
      <div class="tabla"><table><tr><th>Letra</th><th>Suena parecido a</th><th>Ejemplo</th></tr>
        <tr><td><b>b · d · g</b></td><td>p · t · k suaves, sin vibrar la garganta</td><td>${pyBtn("八", "bā")}</td></tr>
        <tr><td><b>p · t · k</b></td><td>p · t · k con un soplo de aire fuerte</td><td>${pyBtn("他", "tā")}</td></tr>
        <tr><td><b>j · q · x</b></td><td>«y» tensa · «ch» con soplo · «s» con la lengua plana tras los dientes de abajo</td><td>${pyBtn("七", "qī")} ${pyBtn("想", "xiǎng")}</td></tr>
        <tr><td><b>zh · ch · sh · r</b></td><td>con la punta de la lengua doblada hacia atrás; r parecida a la «s» de «mismo» con zumbido</td><td>${pyBtn("中", "zhōng")} ${pyBtn("是", "shì")} ${pyBtn("人", "rén")}</td></tr>
        <tr><td><b>z · c</b></td><td>«ds» · «ts» con soplo</td><td>${pyBtn("字", "zì")} ${pyBtn("菜", "cài")}</td></tr>
        <tr><td><b>h</b></td><td>la «j» española, más suave</td><td>${pyBtn("好", "hǎo")}</td></tr>
        <tr><td><b>ü</b></td><td>di «i» con los labios en «u» (la «u» francesa)</td><td>${pyBtn("女", "nǚ")}</td></tr>
        <tr><td><b>-n · -ng</b></td><td>-n con la lengua arriba; -ng como en «tengo», desde atrás</td><td>${pyBtn("门", "mén")} ${pyBtn("生", "shēng")}</td></tr>
        <tr><td><b>e</b></td><td>una «e» hacia atrás, casi «ə»</td><td>${pyBtn("喝", "hē")}</td></tr>
        <tr><td><b>i</b> tras z c s zh ch sh r</td><td>no es «i»: es el zumbido de la consonante alargado</td><td>${pyBtn("十", "shí")}</td></tr></table></div>
    </section>

    <section><h2>3 · Los ocho trazos básicos</h2>
      <p>Todos los caracteres se arman con estos trazos. En el cuaderno, escribe cada trazo en una sola pasada, sin repasar.</p>
      <div class="trazos">${TRAZOS_BASICOS.map(t => `<div class="trazo"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${t[3]}"/></svg><b>${t[1]}</b><span class="etq">${t[0]}</span><span class="aviso">${t[2]}</span></div>`).join("")}</div>
    </section>

    <section><h2>4 · El orden de los trazos</h2>
      <ol class="reglas">
        <li>De arriba abajo: 三.</li>
        <li>De izquierda a derecha: 川, 你.</li>
        <li>Horizontal antes que vertical cuando se cruzan: 十.</li>
        <li>Barrido izquierda antes que barrido derecha: 人, 八.</li>
        <li>Primero el marco, luego lo de dentro, y la tapa de abajo al final: 日, 国 («entra y cierra la puerta»).</li>
        <li>El centro antes que los lados si son simétricos: 小, 水.</li>
        <li>Los puntos pequeños de arriba o de la derecha van al final: 我.</li>
      </ol>
      <p>La web te corrige si un trazo va en otra dirección o en otro orden, así que fíjate en ella las primeras semanas.</p>
    </section>

    <section><h2>5 · Los componentes</h2>
      <p>Casi todos los caracteres son piezas que se repiten. Una pieza suele dar el significado y otra el sonido: 妈 = 女 «mujer» + 马 mǎ «caballo», que suena parecido. Aprender las piezas convierte 175 dibujos en combinaciones.</p>
      <div class="tabla"><table><tr><th>Pieza</th><th>Significa</th><th>Aparece en</th></tr>
        ${[["亻", "persona", "你 他 们 作 住 做"], ["氵", "agua", "没 汉 漂"], ["讠", "palabra", "谁 语 说 话 认 识 读 请 谢"], ["口", "boca", "吗 呢 叫 吃 喝 哪 听"], ["女", "mujer", "好 她 妈 姐"], ["宀", "techo", "字 家 客"], ["木", "árbol, madera", "校 杯 机 椅 样 桌"], ["艹", "hierba", "茶 菜 苹"], ["日", "sol, día", "明 昨 是 时 星"], ["月", "luna; cuerpo", "有 朋 脑 服 期"], ["心", "corazón", "想 怎"], ["扌", "mano", "打"], ["钅", "metal", "钱 钟"], ["饣", "comida", "饭"], ["犭", "animal", "狗 猫"], ["灬", "fuego", "点 热"]].map(r => `<tr><td class="hz" style="font-size:22px">${r[0]}</td><td>${r[1]}</td><td class="hz">${r[2]}</td></tr>`).join("")}</table></div>
    </section>

    <section><h2>6 · Cómo usar el cuaderno 田字格</h2>
      <p>Cada casilla tiene una cruz y dos diagonales punteadas. Úsalas para centrar el carácter y medir dónde empieza cada trazo. Llena el cuadro sin salirte: los caracteres ocupan siempre el mismo espacio, sean simples (一) o complejos (藏).</p>
      <p><b>Regla de oro: escribe de memoria, no copies.</b> Mira el carácter, tápalo, escríbelo y compara. Si te equivocas, tacha y otra vez. Así se fija; copiar a la vista no deja nada.</p>
      <p>Si no tienes cuaderno 田字格, dibuja la cuadrícula en un cuaderno cuadriculado: cuadros de 2 × 2 con la cruz a lápiz.</p>
    </section>

    <div class="btns"><button class="btn pri ancho" id="b-leida">Leída, a empezar</button></div>
  </div>`;
  $("#b-v").addEventListener("click", () => ir("hoy"));
  $("#b-leida").addEventListener("click", () => { S.guia = 1; guardar(); ir("hoy"); });
}
function pyBtn(h, py) { return `<button class="interruptor" data-audio="${esc(h)}" style="min-height:36px;padding:6px 10px"><span class="hz">${esc(h)}</span> ${esc(py)} ▶</button>`; }

/* ---------- Arranque ---------- */
/* ---------- Entrar ---------- */
function pintarEntrar(mensaje = "") {
  document.querySelector(".tabs").hidden = true;
  document.querySelectorAll(".vista").forEach(s => (s.hidden = s.id !== "v-entrar"));
  marcaSync("");
  $("#m-fecha").textContent = "Escribir chino, 45 minutos al día";
  const el = $("#v-entrar");
  el.innerHTML = `
    <div class="dia"><span class="etq">Entrar</span><div class="grande" style="font-size:40px">Tu cuaderno</div>
      <p class="aviso">Escribe tu usuario y un PIN de 4 números. Si es la primera vez, inventa los dos: la cuenta se crea en el momento.</p></div>
    <form class="entrar" id="f-entrar" autocomplete="on" novalidate>
      <label for="i-usuario" class="etq">Usuario</label>
      <input id="i-usuario" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="24" placeholder="por ejemplo: jhon" value="${esc((() => { try { return localStorage.getItem(CLAVE + "-ultimo") || ""; } catch (e) { return ""; } })())}">
      <label for="i-pin" class="etq">PIN</label>
      <input id="i-pin" name="password" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" maxlength="4" placeholder="••••">
      <p class="estado-quiz mal" id="m-entrar" role="alert">${esc(mensaje)}</p>
      <div class="btns" id="acc-entrar"><button class="btn pri ancho" type="submit">Entrar</button></div>
    </form>
    <p class="aviso">Anota tu PIN. Si lo olvidas, pídele a quien te compartió el cuaderno que lo cambie.</p>`;
  const f = $("#f-entrar"), m = $("#m-entrar");
  const enviar = async crear => {
    const usuario = $("#i-usuario").value.trim(), pin = $("#i-pin").value.trim();
    if (usuario.length < 3) { m.textContent = "El usuario necesita al menos 3 letras o números."; return; }
    if (!/^\d{4}$/.test(pin)) { m.textContent = "El PIN son 4 números."; return; }
    m.className = "estado-quiz"; m.textContent = crear ? "Creando tu cuenta…" : "Entrando…";
    f.querySelectorAll("button").forEach(b => (b.disabled = true));
    try {
      const r = await api(crear ? "/crear" : "/entrar", { method: "POST", body: JSON.stringify({ usuario, pin }) });
      SESION = { token: r.token, usuario: r.usuario };
      try { localStorage.setItem(CLAVE + "-sesion", JSON.stringify(SESION)); localStorage.setItem(CLAVE + "-ultimo", r.usuario); } catch (e) {}
      arrancar();
    } catch (e) {
      f.querySelectorAll("button").forEach(b => (b.disabled = false));
      m.className = "estado-quiz mal";
      const d = e.datos || {};
      if (e.codigo === "no_existe") {
        m.className = "estado-quiz";
        m.textContent = `No hay nadie con el usuario «${usuario.toLowerCase()}». ¿Es la primera vez? Crea tu cuenta con este PIN.`;
        $("#acc-entrar").innerHTML = `<button class="btn sec" type="button" id="b-otro">Corregir el usuario</button><button class="btn rojo ancho" type="button" id="b-crear">Crear mi cuenta</button>`;
        $("#b-crear").addEventListener("click", () => enviar(true));
        $("#b-otro").addEventListener("click", () => pintarEntrar());
      } else if (e.codigo === "pin_incorrecto") m.textContent = `PIN incorrecto. Te quedan ${d.quedan} intentos.`;
      else if (e.codigo === "bloqueado") m.textContent = `Demasiados intentos. Espera ${d.minutos || 15} minutos.`;
      else if (e.codigo === "usuario_invalido") m.textContent = "Usa de 3 a 24 letras o números.";
      else if (e.codigo === "ya_existe") m.textContent = "Ese usuario ya existe. Entra con su PIN o elige otro.";
      else m.textContent = "No hay conexión con el servidor. Revisa tu internet e inténtalo otra vez.";
    }
  };
  f.addEventListener("submit", e => { e.preventDefault(); enviar(false); });
}
function cerrarSesion() {
  SESION = null;
  try { localStorage.removeItem(CLAVE + "-sesion"); } catch (e) {}
  S = estadoVacio();
  pintarEntrar();
}

/* ---------- Arranque ---------- */
let enMarcha = false;
function arrancar() {
  document.querySelector(".tabs").hidden = false;
  $("#v-entrar").hidden = true;
  cargarLocal();
  $("#m-fecha").textContent = `${SESION.usuario} · meta: ${fechaLarga(FIN()).replace(/^\S+ /, "")}`;
  let inicial = "hoy";
  try { const v = localStorage.getItem(CLAVE + "-vista"); if (v && v !== "guia") inicial = v; } catch (e) {}
  ir(inicial);
  marcaSync("Conectando…");
  traerNube().then(() => { if (!S.t) guardar(); });
  if (!enMarcha) {
    enMarcha = true;
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") traerNube(); else subir(); });
  }
}
if (SESION) arrancar(); else pintarEntrar();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
